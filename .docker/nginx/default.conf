server {
    listen      80;
    server_name _;

    root  /var/www/byte_artist/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Static asset caching (immutable build hashes) ─────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires        1y;
        add_header     Cache-Control "public, immutable";
        access_log     off;
        try_files      $uri =404;
    }

    # ── Symfony front controller ───────────────────────────────────────────────
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Use variable so nginx re-resolves after php restarts (requires resolver above).
        set $php_upstream php:9000;
        fastcgi_pass            $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include                 fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/byte_artist/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/byte_artist/public;

        # Forward real client IP when behind a reverse proxy / load balancer
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_read_timeout        60s;
        fastcgi_buffer_size         128k;
        fastcgi_buffers             8 256k;
        fastcgi_busy_buffers_size   256k;

        internal;
    }

    # Deny direct access to any other .php file
    location ~ \.php$ {
        return 404;
    }

    # Deny hidden files (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Deny access to Symfony var/ directory
    location ~ ^/var/ {
        deny all;
    }
}
