user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml font/woff font/woff2;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size    64m;
    client_body_buffer_size 128k;

    # ── FastCGI cache (shared across workers) ─────────────────────────────────
    fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2
        keys_zone=fcgi:10m inactive=60m use_temp_path=off;

    # Docker's internal DNS – resolves service names dynamically.
    # Also prevents startup failure when upstream containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
