[www]

user  = www-data
group = www-data

; FastCGI listener
listen            = 0.0.0.0:9000
listen.backlog    = 511

; ── Process manager ──────────────────────────────────────────────────────────
; dynamic: children scaled between min/max spare based on demand.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
; Recycle workers after N requests to prevent memory leaks
pm.max_requests      = 500

; ── Monitoring endpoints (for healthcheck) ────────────────────────────────────
pm.status_path = /php-fpm-status
ping.path      = /php-fpm-ping
ping.response  = pong

; ── Timeouts ─────────────────────────────────────────────────────────────────
request_terminate_timeout = 60s

; ── Logging ───────────────────────────────────────────────────────────────────
catch_workers_output         = yes
decorate_workers_output      = no
access.log                   = /proc/self/fd/2
access.format                = "%R - %u %t \"%m %r\" %s %{mili}dms %{kilo}MMB"

chdir = /
