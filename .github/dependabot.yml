version: 2
updates:
  # PHP (Composer)
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # JavaScript (npm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Docker base images
  - package-ecosystem: docker
    directory: "/.docker/php"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/.docker/nginx"
    schedule:
      interval: weekly
