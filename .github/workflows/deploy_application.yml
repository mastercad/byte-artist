name: "Deploy Application"

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets:
#   DEPLOY_SSH_HOST       – server hostname or IP
#   DEPLOY_SSH_USER       – SSH login user
#   DEPLOY_SSH_KEY        – SSH private key (ED25519 recommended)
#   DEPLOY_SSH_PORT       – SSH port (default: 22)
#   DEPLOY_PATH           – absolute path on server (e.g. /opt/byte-artist)
#   APP_SECRET            – Symfony APP_SECRET (≥32 random characters)
#   MYSQL_ROOT_PASSWORD   – MySQL root password
#   DATABASE_URL          – full DSN, e.g.
#                           mysql://root:PASSWORD@mysql:3306/byte_artist
#                           ?serverVersion=8.4&charset=utf8mb4
#   MYSQL_DATABASE        – (optional) DB name, default: byte_artist
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Auto-deploy after images are built successfully.
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]
  # Manual trigger: lets you deploy any image tag to any server.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: 'latest'

jobs:
  deploy:
    name: "Deploy via Docker Compose"
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH:          ${{ secrets.DEPLOY_PATH }}
          APP_SECRET:           ${{ secrets.APP_SECRET }}
          MYSQL_ROOT_PASSWORD:  ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          MYSQL_DATABASE:       ${{ secrets.MYSQL_DATABASE }}
          IMAGE_TAG:            ${{ inputs.image_tag || 'latest' }}
          GHCR_TOKEN:           ${{ secrets.GHCR_TOKEN }}
          GHCR_USER:            ${{ github.actor }}
          REPO_OWNER:           ${{ github.repository_owner }}
        with:
          host:     ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH,APP_SECRET,MYSQL_ROOT_PASSWORD,DATABASE_URL,MYSQL_DATABASE,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,REPO_OWNER
          script: |
            set -euo pipefail

            # ── 1. Ensure deploy directory exists and repo is present ─────────
            mkdir -p "${DEPLOY_PATH}"
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "${DEPLOY_PATH}"
            fi
            cd "${DEPLOY_PATH}"
            git fetch --ff-only origin main
            git checkout main
            git pull --ff-only

            # ── 2. Write .env.docker from secrets (idempotent) ────────────────
            #    Permissions 600 so only the deploy user can read the secrets.
            cat > .env.docker <<EOF
            APP_ENV=prod
            APP_SECRET=${APP_SECRET}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE=${MYSQL_DATABASE:-byte_artist}
            DATABASE_URL=${DATABASE_URL}
            HTTP_PORT=80
            EOF
            chmod 600 .env.docker

            # ── 3. Log in to GHCR so docker compose pull works ────────────────
            printf '%s' "${GHCR_TOKEN}" | \
              docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # ── 4. Pull new images ────────────────────────────────────────────
            docker compose --env-file .env.docker pull

            # ── 5. Recreate containers with zero-downtime flag ────────────────
            docker compose --env-file .env.docker up -d --remove-orphans

            # ── 6. Wait for PHP-FPM to become healthy (max 60 s) ─────────────
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' byte_artist_php 2>/dev/null || echo "starting")
              if [ "${STATUS}" = "healthy" ]; then
                echo "PHP container is healthy."
                break
              fi
              echo "Waiting for PHP container (attempt ${i}/12, status: ${STATUS})…"
              sleep 5
            done

            # ── 7. Database migrations ────────────────────────────────────────
            docker compose --env-file .env.docker exec -T php \
              bin/console doctrine:migrations:migrate \
              --no-interaction --allow-no-migration

            # ── 8. Cache warm-up ──────────────────────────────────────────────
            docker compose --env-file .env.docker exec -T php \
              bin/console cache:warmup --env=prod

            # ── 9. Remove dangling images to free disk space ──────────────────
            docker image prune -f

            echo "Deployment complete."

