name: "Build & Push Docker Images"

# Runs after QA passes on main, on version tags, or manually.
on:
  workflow_run:
    workflows: ["Quality Assurance"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag to apply (e.g. v1.2.3). Defaults to 'latest'."
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  PHP_IMAGE:   ghcr.io/${{ github.repository_owner }}/byte-artist-php
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/byte-artist-nginx

jobs:
  build-push:
    name: "Build & push"
    runs-on: ubuntu-latest

    # Skip if triggered by a failed QA run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ── Metadata / tags ───────────────────────────────────────────────────
      - name: PHP image metadata
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PHP_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: nginx image metadata
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NGINX_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # ── Build & push: PHP-FPM ──────────────────────────────────────────────
      - name: Build & push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: production
          push: true
          tags:   ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          # Layer cache shared across runs for faster rebuilds.
          cache-from: type=gha,scope=php-prod
          cache-to:   type=gha,mode=max,scope=php-prod

      # ── Build & push: nginx ────────────────────────────────────────────────
      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/nginx/Dockerfile
          push: true
          tags:   ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha,scope=nginx-prod
          cache-to:   type=gha,mode=max,scope=nginx-prod

      # ── Cleanup: keep only the 5 most recent sha- versions ────────────────
      - name: Delete old PHP image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name:      byte-artist-php
          package-type:      container
          min-versions-to-keep: 5
          ignore-versions:   '^(latest|v\d+\..*)$'
          token:             ${{ secrets.GHCR_TOKEN }}

      - name: Delete old nginx image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name:      byte-artist-nginx
          package-type:      container
          min-versions-to-keep: 5
          ignore-versions:   '^(latest|v\d+\..*)$'
          token:             ${{ secrets.GHCR_TOKEN }}
