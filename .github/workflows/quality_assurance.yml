name: "Quality Assurance"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # ── PHP: lint, static analysis, unit + integration tests ───────────────────
  php:
    name: "PHP QA"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: byte_artist_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --password=root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # PHPUnit picks this up (no force="true" on DATABASE_URL in phpunit.xml.dist)
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/byte_artist_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          extensions: zip, mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Symfony environment
        run: |
          echo "APP_ENV=test" > .env.local
          echo "APP_SECRET=ci_secret_for_testing_only_32ch" >> .env.local

      - name: PHP Security Checker
        uses: StephaneBour/actions-php-security-checker@1.1

      - name: PHP CodeSniffer
        run: ./bin/phpcs --standard=phpcs.xml.dist src/

      - name: PHP CS Fixer (dry-run)
        run: |
          cp .php-cs-fixer.dist.php .php-cs-fixer.php
          ./bin/php-cs-fixer fix --dry-run --diff src

      - name: PHPUnit (with coverage)
        run: ./bin/phpunit --configuration phpunit.xml.dist

  # ── JavaScript: vitest ─────────────────────────────────────────────────────
  js:
    name: "JS QA"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
