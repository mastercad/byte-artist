    - name: Cleanup Report Results
      shell: bash
      run: |
         [ -f build/reports/junit.xml ] && sed -i 's/\(.*file="\).*byte-artist\/\(.*"\)/\1\2/g' build/reports/junit.xml || true
         [ -f build/reports/coverage-clover.xml ] && sed -i 's/\(.*name="\).*byte-artist\/\(.*"\)/\1\2/g' build/reports/coverage-clover.xml || true

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Unit Test Results
        path: |
          build/reports/junit.xml
          build/reports/coverage-clover.xml

    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: build/reports/junit.xml
        github_token: ${{ github.token }}

    - name: output reports content for debug
      run: ls -lisa ./build/reports/ || true

    - name: SonarCloud Scan
