name: "Quality Assurance"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # ── PHP: lint, static analysis, unit + integration tests ───────────────────
  php:
    name: "PHP QA"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: byte_artist_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --password=root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # PHPUnit picks this up (no force="true" on DATABASE_URL in phpunit.xml.dist)
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/byte_artist_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          extensions: zip, mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare Symfony environment
        run: |
          echo "APP_ENV=test" > .env.local
          echo "APP_SECRET=ci_secret_for_testing_only_32ch" >> .env.local

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP Security Checker
        uses: StephaneBour/actions-php-security-checker@1.1

      - name: PHP CodeSniffer
        run: ./bin/phpcs --standard=phpcs.xml.dist src/

      - name: PHP CS Fixer (dry-run)
        run: |
          cp .php-cs-fixer.dist.php .php-cs-fixer.php
          ./bin/php-cs-fixer fix --dry-run --diff src

      - name: PHPUnit (with coverage)
        run: ./bin/phpunit --configuration phpunit.xml.dist

      - name: Cleanup Report Results
        shell: bash
        run: |
           [ -f build/reports/junit.xml ] && sed -i 's/\(.*file="\).*byte-artist\/\(.*"\)/\1\2/g' build/reports/junit.xml || true
           [ -f build/reports/coverage-clover.xml ] && sed -i 's/\(.*name="\).*byte-artist\/\(.*"\)/\1\2/g' build/reports/coverage-clover.xml || true

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results
          path: |
            build/reports/junit.xml
            build/reports/coverage-clover.xml

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/reports/junit.xml
          github_token: ${{ github.token }}

      - name: output reports content for debug
        run: ls -lisa ./build/reports/ || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  # ── JavaScript: vitest ─────────────────────────────────────────────────────
  js:
    name: "JS QA"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

