# Production docker-compose.
# Dev overrides live in docker-compose.override.yml (auto-loaded by Docker Compose).
#
# Required env vars (set via .env.docker or shell environment):
#   APP_SECRET, DATABASE_URL, MYSQL_ROOT_PASSWORD
#
# Optional:
#   HTTP_PORT (default 80), MYSQL_DATABASE (default byte_artist)

services:

  # ── nginx ─────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    image: ghcr.io/mastercad/byte-artist-nginx:latest
    container_name: byte_artist_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - images_dynamic:/var/www/byte_artist/public/images/content/dynamisch:ro
      - images_upload:/var/www/byte_artist/public/images/upload:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - byte_artist_net

  # ── PHP-FPM ───────────────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: production
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    image: ghcr.io/mastercad/byte-artist-php:latest
    container_name: byte_artist_php
    restart: unless-stopped
    environment:
      APP_ENV:      "${APP_ENV:-prod}"
      APP_SECRET:   "${APP_SECRET}"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - uploads:/var/www/byte_artist/public/uploads
      - images_dynamic:/var/www/byte_artist/public/images/content/dynamisch
      - images_upload:/var/www/byte_artist/public/images/upload
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - byte_artist_net
    healthcheck:
      test: ["CMD-SHELL",
             "SCRIPT_NAME=/php-fpm-ping SCRIPT_FILENAME=/php-fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 30s

  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: byte_artist_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE:      "${MYSQL_DATABASE:-byte_artist}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - byte_artist_net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s

volumes:
  db_data:
  uploads:
  images_dynamic:
  images_upload:

networks:
  byte_artist_net:
    driver: bridge